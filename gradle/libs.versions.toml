[versions]
agp = "9.4.1"
kotlin = "2.2.21"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.08.00"
navigation = "2.10.0"
datastore = "1.2.1"
play-services-location = "21.4.0"
fragment = "1.9.0"
maplibre = "13.6.0"
work = "2.11.2"
mlkit-text = "16.0.1"
junit = "4.13.2"
org-json = "20260814"
androidx-test-ext = "1.3.0"
androidx-test-runner = "1.7.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "play-services-location" }
# play-services-location drags in fragment 1.1.0, whose FragmentActivity does not
# call super.onRequestPermissionsResult() — which would silently break the
# permission callbacks this app registers. Pinned forward explicitly.
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
maplibre-android = { group = "org.maplibre.gl", name = "android-sdk", version.ref = "maplibre" }
androidx-work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "work" }
# On-device text recognition, for reading a photographed lab report.
#
# The bundled model, not the Play Services one. The unbundled build was tried
# first because it keeps the download small, and it failed the first scan on a
# clean device: Play Services had not fetched the OCR module yet, so the app
# said "that file could not be read" about a perfectly good photograph. Someone
# standing in a lab with a report in their hand, on a phone that may have no
# usable connection, cannot wait for a model to arrive. ~4MB is the price of
# the feature working the first time it is used.
mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkit-text" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# Android's android.jar ships org.json as method stubs that throw; unit tests
# need a real implementation on the classpath to exercise the feed parser.
org-json = { group = "org.json", name = "json", version.ref = "org-json" }

# UI tests: Compose's test rule, driven by the AndroidX runner on an emulator
# or a phone. The manifest artefact supplies the empty activity the rule hosts
# content in, and ships only in debug builds.
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-ext" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidx-test-runner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
